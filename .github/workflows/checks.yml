name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.16'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - name: Lint Python and shell scripts
        run: |
          uvx ruff@0.14.3 check --select E9,F63,F7,F82 api analytics collector migrations notifier scripts
          bash -n run_tests.sh
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run all service tests and frontend type checks
        run: bash run_tests.sh
        env:
          UV_FROZEN: 'true'
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-reports
          path: test-results/*.html
          if-no-files-found: ignore
          retention-days: 14
