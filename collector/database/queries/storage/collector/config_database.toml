[SELECT]
by_id = """
SELECT id, database_id, name, interval, is_paused, next_run_at
FROM collector.config_database
WHERE id = %(id)s
"""

by_database_id = """
SELECT id, database_id, name, interval, is_paused, next_run_at
FROM collector.config_database
WHERE database_id = %(database_id)s
"""

all = """
SELECT id, database_id, name, interval, is_paused, next_run_at
FROM collector.config_database
"""

[UPDATE]
workload_unavailable = """
UPDATE collector.config_database
SET consecutive_errors = LEAST(consecutive_errors + 1, 3),
    is_paused = is_paused OR consecutive_errors + 1 >= 3,
    warning = CASE WHEN consecutive_errors + 1 >= 3 THEN
        'pg_stat_statements collection automatically disabled after 3 consecutive failures: extension or view unavailable. Install/configure the extension, then enable this collector again.'
        ELSE warning END
WHERE database_id = %(database_id)s AND name = 'query_workload_collector'
RETURNING consecutive_errors, warning
"""

workload_reset = """
UPDATE collector.config_database SET consecutive_errors = 0,
    warning = CASE WHEN %(clear_warning)s THEN NULL ELSE warning END
WHERE database_id = %(database_id)s AND name = 'query_workload_collector'
"""

running = """
UPDATE collector.config_database
SET next_run_at = now() + (interval * interval '1 second')
WHERE id = %(id)s
"""

success = """
UPDATE collector.config_database
SET next_run_at = now() + (interval * interval '1 second')
WHERE id = %(id)s
"""

error = """
UPDATE collector.config_database
SET next_run_at = now() + (interval * interval '1 second')
WHERE id = %(id)s
"""

paused = """
UPDATE collector.config_database
SET is_paused = %(is_paused)s
WHERE id = %(id)s
"""

set_next_run_on_force = """
UPDATE collector.config_database
SET next_run_at = now()
WHERE id = %(id)s
"""

set_interval = """
UPDATE collector.config_database
SET interval = %(interval)s
WHERE id = %(id)s
"""

set_settings = """
UPDATE collector.config_database
SET interval = %(interval)s,
    is_paused = CASE WHEN name = 'query_workload_collector' AND warning IS NOT NULL THEN TRUE ELSE %(is_paused)s END
WHERE id = %(id)s
"""
